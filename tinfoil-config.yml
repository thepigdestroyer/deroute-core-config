# Tinfoil Container Configuration for deroute-core
# For updates: edit this file, commit, and run the Tinfoil Release workflow.
cvm-version: 0.14.7
cpus: 2
memory: 8192

attested-keys:
  - id: egress-signing
    key: ed25519
    uid: 1000
    gid: 1000
  - id: tree-signing
    key: ed25519
    uid: 1000
    gid: 1000

networks:
  core-egress:
    egress: allowlist
    allow:
      # MongoDB Atlas cluster SRV & replica set shard hosts (from dns.resolveSrv on _mongodb._tcp.drouter.0mvrm0i.mongodb.net)
      - drouter.0mvrm0i.mongodb.net
      - ac-cdskmit-shard-00-00.0mvrm0i.mongodb.net
      - ac-cdskmit-shard-00-01.0mvrm0i.mongodb.net
      - ac-cdskmit-shard-00-02.0mvrm0i.mongodb.net
      # Google Gemini Interactions API (@google/genai control plane)
      - generativelanguage.googleapis.com

containers:
  - name: "deroute-core"
    image: "ghcr.io/thepigdestroyer/deroute-core@sha256:82be4787cf95bc8776b1e4c0b91dabfc4e0b6fe967d0200203be7dd0c6c64c86"
    user: "1000:1000"
    read_only: true
    tmpfs:
      /tmp: "size=64m"
    env:
      - NODE_ENV: "production"
      - PORT: "8080"
      - HOST: "0.0.0.0"
      - MONGODB_DB: "drouter"
      - CORE_KEY_SOURCE: "tinfoil"
    secrets:
      - MONGODB_URI
      - GEMINI_API_KEY
      - CORE_OPERATOR_TOKEN
    keys:
      - egress-signing
      - tree-signing
    networks:
      - core-egress

shim:
  upstream-port: 8080
  paths:
    - /health
    - /knowledge/corpus
    - /agent/plan
    - /keys
  origins:
    - https://drouter-demo.vercel.app
    - http://localhost:3000
